# ==============================================================================
# UPPCL X Complaint Monitoring & Routing Configuration
# ==============================================================================

system:
  app_name: "UPPCL X Complaint Monitoring & Sheet Sync"
  version: "1.0.0"
  timezone: "Asia/Kolkata"
  polling_interval_minutes: 5
  dry_run: true
  auto_post_enabled: false
  emergency_stop: false
  daily_post_cap: 50

# Monitored Apex Accounts (Consumer complaint & escalation handles)
monitored_accounts:
  - handle: "@UPPCLLKO"
    code: "upl"
    name: "UPPCL Official"
  - handle: "@EMofficeUP"
    code: "emo"
    name: "Energy Minister Office UP"
  - handle: "@AKSharmaOffice"
    code: "ako"
    name: "AK Sharma Minister Office"
  - handle: "@aksharmaBharat"
    code: "akb"
    name: "AK Sharma Cabinet Minister"
  - handle: "@ChairmanUppcl"
    code: "upc"
    name: "Chairman UPPCL"
  - handle: "@mduppcl"
    code: "upm"
    name: "MD UPPCL"

# Receiving DISCOM Corporate Accounts (Official HQ Handles)
discoms:
  PVVNL:
    name: "Pashchimanchal Vidyut Vitran Nigam Limited"
    handle: "@PVVNLHQ"
    headquarters: "Meerut"
    region: "Western UP"
  DVVNL:
    name: "Dakshinanchal Vidyut Vitran Nigam Limited"
    handle: "@dvvnlhq"
    headquarters: "Agra"
    region: "Southern / South-Western UP"
  PuVVNL:
    name: "Purvanchal Vidyut Vitran Nigam Limited"
    handle: "@PuVVNLHQ"
    headquarters: "Varanasi"
    region: "Eastern UP"
  KESCo:
    name: "Kanpur Electricity Supply Company"
    handle: "@KESCoHQ"
    headquarters: "Kanpur"
    region: "Kanpur Urban"
  MVVNL:
    name: "Madhyanchal Vidyut Vitran Nigam Limited"
    handle: "@MVVNLHQ"
    headquarters: "Lucknow"
    region: "Central UP"

# Permitted reply recipient accounts (Safety allowlist)
allowed_discom_handles:
  - "@PVVNLHQ"
  - "@dvvnlhq"
  - "@PuVVNLHQ"
  - "@KESCoHQ"
  - "@MVVNLHQ"

