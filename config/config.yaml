# Shift Windows (Indian Standard Time - UTC+5:30)
shifts:
  NIGHT: { start_hour: 22, end_hour: 6 }
  MORNING: { start_hour: 6, end_hour: 14 }
  EVENING: { start_hour: 14, end_hour: 22 }

# Official Reply Templates
reply_templates:
  SUPPLY_OUTAGE:
    hi: "Concerned team {discom_handle}, कृपया सम्मानित उपभोक्ता की बिजली आपूर्ति बाधित होने की शिकायत का संज्ञान लेकर आवश्यक कार्यवाही करें।"
    en: "Concerned team {discom_handle}, kindly look into this consumer power supply outage grievance and take prompt action."
  TRANSFORMER_DAMAGE:
    hi: "Concerned team {discom_handle}, कृपया क्षतिग्रस्त परिवर्तक (ट्रांसफार्मर) का अविलंब संज्ञान लेकर नियमानुसार आवश्यक कार्यवाही सुनिश्चित करें।"
    en: "Concerned team {discom_handle}, kindly inspect the damaged transformer and expedite replacement/repairs."
  BILL_RELATED:
    hi: "Concerned team {discom_handle}, कृपया सम्मानित उपभोक्ता की बिल सम्बन्धी शिकायत का संज्ञान लेकर त्वरित निस्तारण सुनिश्चित करें।"
    en: "Concerned team {discom_handle}, kindly examine this billing grievance and assist the consumer."
  POLE_RELATED:
    hi: "Concerned team {discom_handle}, कृपया क्षतिग्रस्त पोल/तार की सूचना को गंभीरता से संज्ञान में लेकर तत्काल आवश्यक अनुरक्षण कार्य कराएं।"
    en: "Concerned team {discom_handle}, kindly inspect this damaged pole/wire hazard and ensure electrical safety immediately."
  SUPPLY_VOLTAGE:
    hi: "Concerned team {discom_handle}, कृपया वोल्टेज समस्या (लो/हाई वोल्टेज) का संज्ञान लेकर आपूर्ति को सामान्य कराना सुनिश्चित करें।"
    en: "Concerned team {discom_handle}, kindly address this voltage fluctuation grievance and restore stable supply."
  CONNECTION_NEW:
    hi: "Concerned team {discom_handle}, कृपया नवीन संयोजन (नए कनेक्शन) सम्बन्धी इस प्रकरण का संज्ञान लेकर आवश्यक कार्यवाही करें।"
    en: "Concerned team {discom_handle}, kindly review this new electricity connection application request."
  ACCIDENT_PRONE_TO_OCCURED:
    hi: "Concerned team {discom_handle}, कृपया सुरक्षा खतरे / संभावित दुर्घटना की इस सूचना पर तत्काल प्राथमिकता के आधार पर कार्यवाही करें।"
    en: "Concerned team {discom_handle}, urgent: please address this electrical safety hazard on high priority."
  DEFAULT:
    hi: "Concerned team {discom_handle}, कृपया इस जनशिकायत का संज्ञान लेकर नियमानुसार आवश्यक कार्यवाही सुनिश्चित करें।"
    en: "Concerned team {discom_handle}, kindly look into this consumer grievance and take appropriate action."
