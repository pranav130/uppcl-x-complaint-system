[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uppcl-x-complaint-system"
version = "1.0.0"
description = "Automated UPPCL X Complaint Monitoring and Google Sheets Management System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
    "gspread>=6.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
uppcl-monitor = "uppcl_x_automation.cli:main"

[tool.setuptools.packages.find]
include = ["uppcl_x_automation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
